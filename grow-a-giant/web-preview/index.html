<title>Grow a Giant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D world you walk around; HUD floats on top - stats top center, minimap top left,
   leaderboard top right, stomach + backpack bottom center, station panels slide in on the right. */
:root {
  color-scheme: dark;
  --panel: rgba(22, 25, 42, 0.86);
  --raised: #2c3052;
  --line: rgba(255, 255, 255, 0.10);
  --text: #f6f5fb;
  --muted: #a9adc6;
  --cash: #8ee87a;
  --gold: #ffd84a;
  --buy: #3fae5f;
  --feed: #f08c32;
  --lab: #7a6cf0;
  --off: #474a63;
  --bad: #e2574c;
  --sky: #8fd0f5;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Rubik", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; overflow: hidden; background: var(--sky); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.hud { position: fixed; inset: 0; pointer-events: none; }
.hud .live { pointer-events: auto; }
.pad { position: absolute; }

.stats {
  top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 16px; padding: 7px 16px; border-radius: 16px; white-space: nowrap;
  background: var(--panel); backdrop-filter: blur(6px); box-shadow: 0 6px 20px rgba(0,0,0,.25); font-variant-numeric: tabular-nums;
}
.stat { display: flex; flex-direction: column; line-height: 1.05; }
.stat small { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 25px; }
#cash { color: var(--cash); }
#income { font-size: 16px; color: var(--muted); }
.sep { width: 1px; align-self: stretch; background: var(--line); }

#minimap { top: calc(10px + env(safe-area-inset-top, 0px)); left: 16px; width: 150px; height: 150px; border-radius: 50%; background: rgba(22,25,42,.75); box-shadow: 0 6px 20px rgba(0,0,0,.25); border: 3px solid rgba(255,255,255,.25); }

.board { top: calc(10px + env(safe-area-inset-top, 0px)); right: 16px; width: 210px; padding: 8px 10px 10px; border-radius: 14px; background: var(--panel); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.board h3, .stomach h3 { margin: 0 0 6px; font-size: 10px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.board ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
.board li { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; padding: 3px 6px; border-radius: 6px; }
.board li.me { background: rgba(255, 216, 74, .18); font-weight: 700; }
.board li .r { color: var(--muted); }
.board li:first-child .r { color: var(--gold); }

.bottom { left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
.bag { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 12px; background: var(--panel); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bag-items { display: flex; gap: 4px; flex-wrap: wrap; max-width: 300px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 3px; border-radius: 99px; background: var(--raised); font-size: 12px; }
.chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.stomach { padding: 8px 10px 10px; border-radius: 16px; background: var(--panel); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.stomach h3 { text-align: center; }
.slots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
.slot { position: relative; width: 74px; height: 40px; border-radius: 9px; background: var(--raised); overflow: hidden; display: grid; place-content: center; text-align: center; }
.slot .fill { position: absolute; inset: 0 auto 0 0; width: 0; opacity: .6; }
.slot span { position: relative; font-weight: 700; font-size: 12px; }
.slot.empty span { color: var(--muted); font-weight: 500; }

.toasts { top: calc(108px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; width: min(420px, calc(100% - 32px)); }
.toast { padding: 8px 14px; border-radius: 10px; font-weight: 500; font-size: 14px; text-align: center; background: #3b67c9; box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: opacity .4s, transform .4s; }
.toast.error { background: var(--bad); } .toast.success { background: var(--buy); }
.toast.out { opacity: 0; transform: translateY(-6px); }

.banner { top: 26%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center; white-space: nowrap; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .3s; }
.banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.banner b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 64px); color: var(--gold); text-shadow: 0 4px 0 #9c6a00, 0 8px 18px rgba(0,0,0,.35); letter-spacing: .02em; }
.banner span { font-weight: 700; font-size: 16px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }

.event { top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 5px 14px; border-radius: 99px; background: #2f8fd8; font-weight: 700; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.25); white-space: nowrap; }

.panel { right: 16px; top: 50%; transform: translateY(-50%); width: 330px; max-height: calc(100% - 300px); min-height: 200px; display: flex; flex-direction: column; border-radius: 16px; background: var(--panel); backdrop-filter: blur(6px); box-shadow: 0 8px 26px rgba(0,0,0,.3); }
.panel header { padding: 12px 14px 4px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.panel header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.list { overflow-y: auto; padding: 8px 10px 10px; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; background: var(--raised); }
.icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 18px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.22), inset 0 4px 0 rgba(255,255,255,.25); }
.info { min-width: 0; }
.name { font-weight: 700; font-size: 14px; }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 4px; }
.btn { min-width: 66px; padding: 5px 10px; border-radius: 8px; font-weight: 700; font-size: 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); transition: filter .15s, transform .05s; }
.btn:hover { filter: brightness(1.12); } .btn:active { transform: translateY(1px); }
.btn.buy { background: var(--buy); } .btn.lab { background: var(--lab); } .btn.feed { background: var(--feed); }
.btn.off { background: var(--off); color: var(--muted); }

.label3d { position: absolute; left: 0; top: 0; pointer-events: none; text-align: center; white-space: nowrap; font-family: var(--font-display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 8px rgba(0,0,0,.35); will-change: transform; }
.label3d.giant { font-size: 16px; } .label3d.giant b { display: block; font-size: 22px; font-weight: 400; color: var(--gold); }
.label3d.mine b { font-size: 28px; }
.label3d.station { font-size: 20px; padding: 3px 10px; border-radius: 10px; background: rgba(22,25,42,.7); text-shadow: none; }
.label3d.station small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); font-weight: 500; }
.pop { position: absolute; left: 0; top: 0; pointer-events: none; font-family: var(--font-display); font-size: 22px; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.5); }

.help { left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: rgba(255,255,255,.92); line-height: 1.45; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 220px; }
.help kbd { font-family: var(--font-body); font-weight: 700; padding: 0 5px; border-radius: 4px; background: rgba(22,25,42,.7); }

.joy { width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); transform: translate(-50%, -50%); }
.joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.55); }
.jump { right: 22px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px; border-radius: 50%; background: rgba(22,25,42,.75); border: 2px solid rgba(255,255,255,.35); font-family: var(--font-display); font-size: 18px; }

.devbtn { right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 5px 10px; border-radius: 8px; background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 700; }
.devpanel { right: 16px; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; padding: 10px; border-radius: 12px; background: var(--panel); width: 190px; }
.devpanel p { margin: 0; font-size: 12px; color: var(--muted); }
.devpanel .btn { background: var(--raised); text-align: left; }

@media (max-width: 760px) {
  .stats { gap: 9px; padding: 6px 10px; } .stat b { font-size: 19px; } #income { font-size: 13px; }
  #minimap { width: 92px; height: 92px; top: calc(62px + env(safe-area-inset-top, 0px)); }
  .board { width: 150px; top: calc(62px + env(safe-area-inset-top, 0px)); padding: 6px 8px; }
  .board li { font-size: 11px; padding: 2px 4px; grid-template-columns: 14px 1fr auto; }
  .board li:nth-child(n+5):not(.me) { display: none; }
  .panel { left: 16px; right: 16px; width: auto; top: calc(62px + env(safe-area-inset-top, 0px)); transform: none; max-height: 44%; min-height: 0; }
  .slot { width: 58px; height: 34px; } .slot span { font-size: 11px; }
  .bag { font-size: 12px; } .bag-items { max-width: 220px; }
  .help { display: none; }
  .event { top: calc(166px + env(safe-area-inset-top, 0px)); }
  .toasts { top: calc(196px + env(safe-area-inset-top, 0px)); }
  .devbtn { top: calc(168px + env(safe-area-inset-top, 0px)); bottom: auto; }
  .devpanel { top: calc(200px + env(safe-area-inset-top, 0px)); bottom: auto; }
}
@media (prefers-reduced-motion: reduce) { .toast, .banner { transition: none; } }
</style>

<canvas id="scene" aria-label="Grow a Giant 3D world. Walk with WASD or arrow keys, jump with Space, drag to turn the camera."></canvas>
<div class="hud" id="hud">
  <div id="labels"></div>

  <div class="pad stats" role="status">
    <div class="stat"><small>Cash</small><b id="cash">$0</b></div>
    <div class="stat"><small>Income</small><b id="income">+1/s</b></div>
    <span class="sep"></span>
    <div class="stat"><small>Your Giant</small><b id="height">10.0m</b></div>
  </div>

  <canvas class="pad" id="minimap" width="300" height="300" aria-label="Minimap"></canvas>

  <section class="pad board" aria-label="Tallest Giants">
    <h3>TALLEST GIANTS</h3>
    <ol id="board"></ol>
  </section>

  <div class="pad event" id="event" hidden></div>
  <div class="pad toasts" id="toasts" aria-live="polite"></div>
  <div class="pad banner" id="banner"><b id="bannerBig"></b><span id="bannerSmall"></span></div>

  <section class="pad panel live" id="panel" hidden aria-live="polite">
    <header><h2 id="panelTitle"></h2><p id="panelSub"></p></header>
    <div class="list" id="panelList"></div>
  </section>

  <div class="pad bottom">
    <div class="bag live"><span id="bagCount">Backpack 0/10</span><span class="bag-items" id="bagItems"></span></div>
    <section class="stomach" aria-label="Stomach"><h3>STOMACH</h3><div class="slots" id="slots"></div></section>
  </div>

  <p class="pad help" id="help"><kbd>WASD</kbd> walk · <kbd>Space</kbd> jump · drag to look<br>Buy food at the <b>Market</b>, grab free food in the <b>Orchard</b>, carry it to the <b>Feeding Pad</b>.</p>

  <div class="pad joy" id="joy" hidden><i id="joyKnob"></i></div>
  <button class="pad jump live" id="jumpBtn" hidden>JUMP</button>

  <button class="pad devbtn live" id="devBtn" aria-expanded="false">Test tools</button>
  <div class="pad devpanel live" id="devPanel" hidden>
    <p>For testing only.</p>
    <button class="btn" id="devCash">+ $1M cash</button>
    <button class="btn" id="devMass">+ 1 billion mass</button>
    <button class="btn" id="devRain">Start Food Rain</button>
    <button class="btn" id="devReset">Reset progress</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";

// ===========================================================================
// Tuning
// ===========================================================================
const FOODS = [
  { id: "apple", name: "Apple", price: 5, mass: 10, digest: 3, color: "#e0413b" },
  { id: "bread", name: "Bread", price: 30, mass: 70, digest: 4, color: "#d9a85e" },
  { id: "burger", name: "Burger", price: 200, mass: 520, digest: 6, color: "#a9612c" },
  { id: "pizza", name: "Pizza", price: 1200, mass: 3600, digest: 8, color: "#f2b53a" },
  { id: "cake", name: "Cake", price: 8000, mass: 24000, digest: 11, color: "#f59ac6" },
  { id: "turkey", name: "Turkey", price: 50000, mass: 180000, digest: 15, color: "#c0743a" },
  { id: "goldsteak", name: "Golden Steak", price: 350000, mass: 1500000, digest: 20, color: "#ffd700" },
  { id: "galaxy", name: "Galaxy Donut", price: 2.5e6, mass: 1.2e7, digest: 26, color: "#8a5cff" },
];
const FOOD = Object.fromEntries(FOODS.map((f, i) => [f.id, Object.assign(f, { tier: i })]));

const UPGRADES = [
  { id: "bag", name: "Bigger Backpack", icon: "B", color: "#3f8fd8", base: 60, growth: 2.1, max: 15, text: l => `Carry ${10 + 5 * l} → ${15 + 5 * l} items` },
  { id: "slots", name: "Stretchy Stomach", icon: "S", color: "#f08c32", base: 120, growth: 2.6, max: 8, text: l => `${4 + l} → ${5 + l} stomach slots` },
  { id: "digest", name: "Turbo Digestion", icon: "D", color: "#e2574c", base: 90, growth: 2.2, max: 20, text: l => `Digest ${(1 + .3 * l).toFixed(1)}x → ${(1.3 + .3 * l).toFixed(1)}x speed` },
  { id: "coin", name: "Golden Sweat", icon: "$", color: "#d9b21a", base: 150, growth: 2.3, max: 25, text: l => `Coins worth ${(1 + .4 * l).toFixed(1)}x → ${(1.4 + .4 * l).toFixed(1)}x` },
  { id: "speed", name: "Running Shoes", icon: "R", color: "#3fae5f", base: 80, growth: 2.0, max: 10, text: l => `Run ${(18 * (1 + .12 * l)).toFixed(0)} → ${(18 * (1 + .12 * (l + 1))).toFixed(0)} speed` },
  { id: "magnet", name: "Coin Magnet", icon: "M", color: "#c94fd8", base: 200, growth: 2.4, max: 10, text: l => `Pull coins from ${6 + 3 * l} → ${9 + 3 * l} studs` },
];
const UP = Object.fromEntries(UPGRADES.map(u => [u.id, u]));
const upCost = (u, lvl) => Math.round(u.base * Math.pow(u.growth, lvl));

const Growth = {
  height: m => 10 + 25 * Math.log(1 + Math.max(m, 0) / 100),
  scale: h => 1 + 11 * (1 - Math.exp(-Math.max(h - 10, 0) / 150)),
  income: h => Math.pow(Math.max(h, 10) / 10, 2),
};
const MILESTONES = [15, 20, 30, 40, 50, 75, 100, 125, 150, 200, 250, 300, 400, 500, 750, 1000];
const RAIN_EVERY = 75, RAIN_LENGTH = 14, FIRST_RAIN = 35;

// ===========================================================================
// Formatting
// ===========================================================================
const SUF = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
function fmtNum(n) {
  if (!isFinite(n)) return "0";
  const sign = n < 0 ? "-" : ""; n = Math.abs(n);
  if (n < 1000) return sign + Math.floor(n);
  const t = Math.min(Math.floor(Math.log10(n) / 3), SUF.length - 1);
  const s = n / Math.pow(10, t * 3);
  let x = s >= 100 ? String(Math.floor(s)) : s >= 10 ? (Math.floor(s * 10) / 10).toFixed(1) : (Math.floor(s * 100) / 100).toFixed(2);
  if (x.includes(".")) x = x.replace(/0+$/, "").replace(/\.$/, "");
  return sign + x + SUF[t + 1];
}
const fmtCash = n => "$" + fmtNum(n);
const fmtH = m => m < 1000 ? m.toFixed(1) + "m" : fmtNum(m) + "m";

// ===========================================================================
// Save data (this browser only)
// ===========================================================================
const SAVE_KEY = "grow-a-giant-v2";
function fresh() {
  return { cash: 25, mass: 0, bag: {}, stomach: [], up: { bag: 0, slots: 0, digest: 0, coin: 0, speed: 0, magnet: 0 }, playTime: 0, best: 0, lastSeen: Date.now(), tutorial: true };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (!d) return null;
    const b = fresh();
    for (const k in b) if (d[k] !== undefined && typeof d[k] === typeof b[k]) b[k] = d[k];
    b.up = Object.assign(fresh().up, d.up || {});
    return b;
  } catch (e) { return null; }
}
function save() { S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

const hot = window.claude && window.claude.hot;
let S = (hot && hot.data && hot.data.S) || load() || fresh();
if (hot && hot.snapshot) hot.snapshot(() => ({ S }));

const bagCap = () => 10 + 5 * S.up.bag;
const slotCap = () => 4 + S.up.slots;
const digestMult = () => 1 + 0.3 * S.up.digest;
const coinMult = () => 1 + 0.4 * S.up.coin;
const runSpeed = () => 18 * (1 + 0.12 * S.up.speed);
const magnetR = () => 6 + 3 * S.up.magnet;
const bagCount = () => Object.values(S.bag).reduce((a, b) => a + b, 0);
const myHeight = () => Growth.height(S.mass);

function digest(dt) {
  let gained = 0; const left = [];
  for (const it of S.stomach) {
    const f = FOOD[it.id]; if (!f) continue;
    const step = Math.min(dt, it.left);
    gained += f.mass * step / f.digest;
    if (it.left - step > 1e-6) left.push({ id: it.id, left: it.left - step });
  }
  S.stomach = left;
  return gained;
}

// ===========================================================================
// DOM helpers
// ===========================================================================
const $ = id => document.getElementById(id);
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || ""); el.textContent = msg;
  $("toasts").appendChild(el);
  while ($("toasts").children.length > 3) $("toasts").firstChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 400); }, 2800);
}
let lastWarn = 0;
function warnOnce(msg) { const n = performance.now(); if (n - lastWarn > 2500) { lastWarn = n; toast(msg, "error"); } }
let bannerTimer = 0;
function banner(big, small) {
  $("bannerBig").textContent = big; $("bannerSmall").textContent = small || "";
  $("banner").classList.add("show"); clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => $("banner").classList.remove("show"), 2600);
}

// ===========================================================================
// Three.js world
// ===========================================================================
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd0f5);
scene.fog = new THREE.Fog(0x8fd0f5, 220, 900);
const camera = new THREE.PerspectiveCamera(60, 1, 0.3, 3000);

scene.add(new THREE.HemisphereLight(0xd6ecff, 0x4a6e3c, 0.62));
const sun = new THREE.DirectionalLight(0xfff2dc, 0.8);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 1, far: 600 });
scene.add(sun); scene.add(sun.target);

const matCache = {};
const mat = (c, emissive) => {
  const k = c + "|" + (emissive || 0);
  return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial({ color: c, emissive: emissive || 0 }));
};
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
function box(w, h, d, c, x, y, z, parent, opts) {
  const m = new THREE.Mesh(boxGeo, mat(c, opts && opts.emissive));
  m.scale.set(w, h, d); m.position.set(x, y, z);
  m.castShadow = !(opts && opts.noShadow); m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function cyl(rt, rb, h, c, x, y, z, parent, seg, opts) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), mat(c, opts && opts.emissive));
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}

// Colliders: circles the player can't walk through. {x, z, r, fn?} (fn returns live radius)
const colliders = [];

// ---- Ground, paths, boundary -------------------------------------------------
const WORLD_R = 300;
const ground = new THREE.Mesh(new THREE.CircleGeometry(1400, 64), mat(0x4f9444));

function foodMesh(id) {
  const f = FOOD[id]; const g = new THREE.Group();
  const c = parseInt(f.color.slice(1), 16);
  switch (id) {
    case "apple": { const s = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), mat(c)); g.add(s); box(0.1, 0.4, 0.1, 0x5a3a1a, 0, 0.8, 0, g); box(0.35, 0.1, 0.2, 0x3e9a3e, 0.2, 0.85, 0, g); break; }
    case "bread": box(1.5, 0.8, 0.9, c, 0, 0, 0, g); box(1.3, 0.2, 0.7, 0xf0d29a, 0, 0.45, 0, g); break;
    case "burger": cyl(0.8, 0.8, 0.35, 0xd99a50, 0, -0.35, 0, g); cyl(0.85, 0.85, 0.25, 0x6a3a1a, 0, 0, 0, g); cyl(0.9, 0.9, 0.08, 0x5ac04a, 0, 0.15, 0, g); cyl(0.6, 0.8, 0.4, 0xd99a50, 0, 0.38, 0, g); break;
    case "pizza": { const p = cyl(1.1, 1.1, 0.2, c, 0, 0, 0, g, 3); box(0.3, 0.1, 0.3, 0xc0392b, 0.2, 0.12, 0, g); box(0.3, 0.1, 0.3, 0xc0392b, -0.3, 0.12, 0.25, g); break; }
    case "cake": cyl(0.9, 0.9, 0.9, c, 0, 0, 0, g); cyl(0.92, 0.92, 0.2, 0xffffff, 0, 0.5, 0, g); box(0.15, 0.4, 0.15, 0xffe066, 0, 0.8, 0, g, { emissive: 0x664400 }); break;
    case "turkey": { const s = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 10), mat(c)); s.scale.set(1.2, 0.8, 1); g.add(s); box(0.25, 0.25, 0.9, 0xf4ead8, 0.6, 0.1, 0.7, g); break; }
    case "goldsteak": box(1.6, 0.4, 1.1, c, 0, 0, 0, g, { emissive: 0x665000 }); break;
    case "galaxy": { const t = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.35, 10, 20), mat(c, 0x2a1066)); t.rotation.x = Math.PI / 2; g.add(t); break; }

// ===========================================================================
// Game systems
// ===========================================================================
let coinTimer = 0, pickupTimer = 0, feedTimer = 0, rainTime = FIRST_RAIN, raining = 0, rainSpawn = 0;
let lastMilestone = MILESTONES.filter(m => m <= S.best).length;
let inFlight = 0;

function startRain() {
  raining = RAIN_LENGTH; rainTime = RAIN_EVERY;
  banner("FOOD RAIN!", "Food is falling from the sky. Grab it!");
}

function bestAffordableTier() {
  let t = 0; for (const f of FOODS) if (f.price <= Math.max(S.cash, 1) * 4) t = f.tier;
  return t;
}

function update(dt, now) {
  S.playTime += dt;
  const h = myHeight();
  const inc = Growth.income(h);

  // Digestion + passive income
  const gained = digest(dt * digestMult());
  if (gained > 0) S.mass += gained;
  S.cash += inc * 0.3 * dt;

  // Milestones
  const hNow = myHeight();
  if (hNow > S.best) S.best = hNow;
  const reached = MILESTONES.filter(m => m <= S.best).length;
  if (reached > lastMilestone) {
    lastMilestone = reached;
    const m = MILESTONES[reached - 1];
    banner(`${m}m TALL!`, "Your Giant is growing. Bonus coins!");
    me.stomp = 1;
    for (let i = 0; i < 12; i++) spawnCoin(inc * coinMult() * 2);
  }

  // Giant drops coins
  coinTimer -= dt;
  if (coinTimer <= 0) { coinTimer = 1; if (coins.length < 40) spawnCoin(inc * coinMult()); }

  // Orchard grows free food
  pickupTimer -= dt;
  if (pickupTimer <= 0) {
    pickupTimer = 1.2;
    if (pickups.filter(p => !p.rain).length < 14) {
      const t = orchardTrees[Math.floor(Math.random() * orchardTrees.length)];
      const roll = Math.random();
      const id = roll < 0.6 ? "apple" : roll < 0.9 ? "bread" : "burger";
      const a = Math.random() * Math.PI * 2;
      spawnPickup(id, t.x + Math.cos(a) * 4.5, t.z + Math.sin(a) * 4.5, 8);
    }
  }

  // Food Rain event
  rainTime -= dt;
  if (rainTime <= 0 && !raining) startRain();
  if (raining > 0) {
    raining -= dt; rainSpawn -= dt;
    $("event").hidden = false; $("event").textContent = `FOOD RAIN · ${Math.ceil(raining)}s`;
    if (rainSpawn <= 0) {
      rainSpawn = 0.18;
      const top = Math.min(FOODS.length - 1, bestAffordableTier() + 1);
      const tier = Math.max(0, top - Math.floor(Math.random() * 3));
      const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 50;
      const p = { x: Math.cos(a) * r, z: Math.sin(a) * r - 10 };
      spawnPickup(FOODS[tier].id, p.x, p.z, 50 + Math.random() * 20);
      pickups[pickups.length - 1].rain = true;
    }
    if (raining <= 0) { raining = 0; }
  } else if (!raining) {
    $("event").hidden = false; $("event").textContent = `Food Rain in ${Math.ceil(rainTime)}s`;
  }

  // Player movement
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1;
  if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (joyId !== null) { mx += joyVec.x; mz -= joyVec.y; }
  const mlen = Math.hypot(mx, mz);
  const speed = runSpeed();
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = -fz, rz = fx;
  let wantX = 0, wantZ = 0;
  if (mlen > 0.05) {
    const k = Math.min(1, mlen) / mlen;
    wantX = (fx * mz + rx * mx) * k * speed; wantZ = (fz * mz + rz * mx) * k * speed;
    player.yaw = Math.atan2(wantX, wantZ);
  }
  const accel = player.grounded ? 14 : 4;
  player.vel.x += (wantX - player.vel.x) * Math.min(1, dt * accel);
  player.vel.z += (wantZ - player.vel.z) * Math.min(1, dt * accel);
  if ((keys.Space || jumpQueued) && player.grounded) { player.vel.y = 24; player.grounded = false; }
  jumpQueued = false;
  player.vel.y -= 70 * dt;
  player.pos.addScaledVector(player.vel, dt);
  if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.grounded = true; }

  // Collisions
  for (const c of colliders) {
    const r = (c.fn ? c.fn() : c.r) + 0.8;
    const dx = player.pos.x - c.x, dz = player.pos.z - c.z, d = Math.hypot(dx, dz);
    if (d < r && d > 0.001 && player.pos.y < 30) { player.pos.x = c.x + dx / d * r; player.pos.z = c.z + dz / d * r; }
  }
  const pd = Math.hypot(player.pos.x, player.pos.z);
  if (pd > WORLD_R) { player.pos.x *= WORLD_R / pd; player.pos.z *= WORLD_R / pd; }

  // Jump pads
  for (const jp of jumpPads) {
    if (player.grounded && Math.hypot(player.pos.x - jp.x, player.pos.z - jp.z) < jp.r) {
      player.vel.y = 75; player.grounded = false;
      burst(new THREE.Vector3(jp.x, 1, jp.z), 0x34d4ff, 14, 6);
    }
  }

  // Stations
  let inside = null;
  for (const st of stations) if (Math.hypot(player.pos.x - st.x, player.pos.z - st.z) < st.r && player.pos.y < 4) inside = st.id;
  const panelStation = inside === "market" || inside === "lab" ? inside : null;
  if (panelStation !== openStation) openPanel(panelStation);

  // Feeding Pad: fling food from the backpack into the Giant's mouth
  feedTimer -= dt;
  if (inside === "feed" && feedTimer <= 0) {
    feedTimer = 0.18;
    if (bagCount() === 0) {
      if (S.stomach.length + inFlight === 0) warnOnce("Your backpack is empty. Get food from the Market or the Orchard.");
    } else if (S.stomach.length + inFlight >= slotCap()) {
      warnOnce("Stomach full! It's digesting. Upgrade it at the Lab.");
    } else {
      // Feed the best food first
      const f = FOODS.slice().reverse().find(x => S.bag[x.id]);
      S.bag[f.id]--; if (!S.bag[f.id]) delete S.bag[f.id];
      const m = foodMesh(f.id); m.position.copy(player.pos).setY(4); scene.add(m);
      flyers.push({ id: f.id, m, from: m.position.clone(), t: 0 });
      inFlight++;
    }
  }

  // Flyers arc to the mouth
  const mouth = new THREE.Vector3();
  me.mouth.getWorldPosition(mouth);
  for (let i = flyers.length - 1; i >= 0; i--) {
    const fl = flyers[i]; fl.t += dt / 0.6;
    const t = Math.min(fl.t, 1);
    fl.m.position.lerpVectors(fl.from, mouth, t);
    fl.m.position.y += Math.sin(t * Math.PI) * 12;
    fl.m.rotation.x += dt * 8; fl.m.rotation.z += dt * 6;
    if (fl.t >= 1) {
      scene.remove(fl.m); flyers.splice(i, 1); inFlight--;
      S.stomach.push({ id: fl.id, left: FOOD[fl.id].digest });
      me.chomp = 1;
      burst(mouth, parseInt(FOOD[fl.id].color.slice(1), 16), 5, 3 * me.shown);
      if (S.tutorial) { S.tutorial = false; toast("Nice! Your Giant is digesting. It drops coins as it grows - run over them!", "success"); }
    }
  }

  // Pickups: fall, bob, get collected
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i]; p.life -= dt;
    if (p.falling) {
      p.vy -= 40 * dt; p.y += p.vy * dt;
      if (p.y <= 0.9) { p.y = 0.9; p.falling = false; burst(new THREE.Vector3(p.x, 0.5, p.z), parseInt(FOOD[p.id].color.slice(1), 16), 4, 3); }
    }
    p.m.position.set(p.x, p.falling ? p.y : 0.9 + Math.sin(now / 300 + i) * 0.25, p.z);
    p.m.rotation.y += dt * 2;
    const d = Math.hypot(player.pos.x - p.x, player.pos.z - p.z);
    if (!p.falling && d < 2.4 && player.pos.y < 3) {
      if (bagCount() < bagCap()) {
        S.bag[p.id] = (S.bag[p.id] || 0) + 1;
        pop(`+1 ${FOOD[p.id].name}`, "#fff", p.m.position);
        burst(p.m.position, parseInt(FOOD[p.id].color.slice(1), 16), 5, 4);
        scene.remove(p.m); pickups.splice(i, 1); continue;
      } else warnOnce("Backpack full! Feed your Giant or upgrade your backpack.");
    }
    if (p.life <= 0) { scene.remove(p.m); pickups.splice(i, 1); }
  }

  // Coins: arc out, bounce, get magneted and collected
  const mr = magnetR();
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i]; c.life -= dt;
    const d = c.m.position.distanceTo(player.pos.clone().setY(2));
    if (c.landed && d < mr) {
      const dir = player.pos.clone().setY(2).sub(c.m.position).normalize();
      c.m.position.addScaledVector(dir, Math.min(d, dt * (30 + (mr - d) * 6)));
    } else if (!c.landed) {
      c.v.y -= 40 * dt; c.m.position.addScaledVector(c.v, dt);
      if (c.m.position.y <= 0.8) { c.m.position.y = 0.8; if (Math.abs(c.v.y) > 6) { c.v.y *= -0.4; c.v.x *= 0.6; c.v.z *= 0.6; } else c.landed = true; }
    }
    c.m.rotation.y += dt * 4;
    if (d < 2.2) {
      S.cash += c.value;
      pop("+" + fmtCash(c.value), "#ffd84a", c.m.position);
      scene.remove(c.m); coins.splice(i, 1); continue;
    }
    if (c.life <= 0) { scene.remove(c.m); coins.splice(i, 1); }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    p.v.y -= 30 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.x += dt * 5; p.m.scale.setScalar(Math.max(0.01, p.life));
    if (p.life <= 0 || p.m.position.y < 0) { scene.remove(p.m); particles.splice(i, 1); }
  }
}

function spawnCoin(value) {
  const m = new THREE.Mesh(coinGeo, coinMat); m.rotation.x = Math.PI / 2; m.castShadow = true;
  const hand = new THREE.Vector3(); me.armR.getWorldPosition(hand);
  m.position.copy(hand); scene.add(m);
  // Aim at a spot in front of the Giant (toward the plaza) so coins land where you can reach them.
  const a = Math.PI / 2 + (Math.random() - 0.5) * 2.4;
  const reach = 3.2 * me.shown + 5 + Math.random() * 14;
  const tx = MY_POS.x + Math.cos(a) * reach, tz = MY_POS.z + Math.sin(a) * reach;
  const T = 1.1;
  const v = new THREE.Vector3((tx - hand.x) / T, (0.8 - hand.y + 20 * T * T) / T, (tz - hand.z) / T);
  coins.push({ m, value, v, landed: false, life: 30 });
}

// ===========================================================================
// Animation of Giants, avatar, scenery
// ===========================================================================
function animateGiant(P, height, dt, t, busy) {
  const target = Growth.scale(height);
  P.shown += (target - P.shown) * Math.min(1, dt * 2);
  P.group.scale.setScalar(P.shown);
  P.chomp = Math.max(0, P.chomp - dt * 3);
  P.stomp = Math.max(0, P.stomp - dt * 1.2);
  const m = reduceMotion ? 0 : 1;
  P.mouth.scale.y = 1 + P.chomp * 4;
  P.head.position.y = 8.6 + (busy ? Math.sin(t * 9) * 0.1 : Math.sin(t * 1.6) * 0.05) * m;
  P.torso.scale.set(3.2 * (busy ? 1.06 : 1), 3.5, 1.8 * (busy ? 1.12 : 1));
  P.armL.rotation.x = Math.sin(t * 1.4) * 0.12 * m - P.chomp * 0.8;
  P.armR.rotation.x = -Math.sin(t * 1.4) * 0.12 * m - P.chomp * 0.8;
  P.armL.rotation.z = -0.08; P.armR.rotation.z = 0.08;
  const st = Math.sin(P.stomp * Math.PI);
  P.legR.rotation.x = -st * 0.9 * m;
  P.group.rotation.z = Math.sin(t * 0.7) * 0.015 * m;
  if (P.stomp > 0 && P.stomp < 0.08 && !P.stomped) { P.stomped = true; shake = 0.6; burst(P.group.position.clone().setY(1), 0xcdb98a, 20, 10); }
  if (P.stomp === 0) P.stomped = false;
}
let shake = 0;

function animateAvatar(dt, t) {
  avatar.position.copy(player.pos);
  const cur = avatar.rotation.y;
  let d = player.yaw - cur; d = Math.atan2(Math.sin(d), Math.cos(d));
  avatar.rotation.y = cur + d * Math.min(1, dt * 12);
  const hs = Math.hypot(player.vel.x, player.vel.z);
  player.walk += dt * hs * 0.55;
  const sw = player.grounded ? Math.sin(player.walk) * Math.min(1, hs / 10) * 0.9 : 0.5;
  av.legL.rotation.x = sw; av.legR.rotation.x = -sw;
  av.armL.rotation.x = -sw; av.armR.rotation.x = sw;
  if (!player.grounded) { av.armL.rotation.z = -0.6; av.armR.rotation.z = 0.6; } else { av.armL.rotation.z = 0; av.armR.rotation.z = 0; }
  shadowBlob.position.set(player.pos.x, 0.2, player.pos.z);
  shadowBlob.scale.setScalar(Math.max(0.3, 1 - player.pos.y / 40));
}

// ===========================================================================
// Minimap
// ===========================================================================
const mm = $("minimap").getContext("2d");
function drawMinimap() {
  const W = 300, R = 150, sc = R / 230;
  mm.clearRect(0, 0, W, W);
  mm.save(); mm.beginPath(); mm.arc(R, R, R, 0, Math.PI * 2); mm.clip();
  mm.fillStyle = "#3f7f3a"; mm.fillRect(0, 0, W, W);
  // rotate so camera-forward is up
  mm.translate(R, R); mm.rotate(camYaw); mm.translate(-player.pos.x * sc, -player.pos.z * sc);
  const dot = (x, z, r, c) => { mm.fillStyle = c; mm.beginPath(); mm.arc(x * sc, z * sc, r, 0, Math.PI * 2); mm.fill(); };
  mm.fillStyle = "#cdb98a"; mm.fillRect((ORCH.x - ORCH.w / 2) * sc, (ORCH.z - ORCH.d / 2) * sc, ORCH.w * sc, ORCH.d * sc);
  dot(0, 0, 18 * sc, "#d9c79a");
  dot(MARKET.x, MARKET.z, 9, "#3fae5f"); dot(LAB.x, LAB.z, 9, "#7a6cf0"); dot(FEED.x, FEED.z, 9, "#f08c32");
  for (const jp of jumpPads) dot(jp.x, jp.z, 5, "#34d4ff");
  for (const r of RIVALS) dot(r.x, r.z, 4 + r.g.shown * 1.4, "#" + r.g.torso.material.color.getHexString());
  dot(MY_POS.x, MY_POS.z, 5 + me.shown * 1.6, "#4f8fd8");
  for (const c of coins) dot(c.m.position.x, c.m.position.z, 2.5, "#ffd84a");
  for (const p of pickups) dot(p.x, p.z, 3, "#ffffff");
  // Player arrow, pointing the way the character faces
  mm.translate(player.pos.x * sc, player.pos.z * sc); mm.rotate(Math.PI - player.yaw);
  mm.fillStyle = "#ffb020"; mm.strokeStyle = "#000"; mm.lineWidth = 2;
  mm.beginPath(); mm.moveTo(0, -12); mm.lineTo(9, 10); mm.lineTo(0, 5); mm.lineTo(-9, 10); mm.closePath(); mm.fill(); mm.stroke();
  mm.restore();
}

// ===========================================================================
// Main loop
// ===========================================================================
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const tmpV = new THREE.Vector3();
let last = performance.now(), hudTimer = 0, saveTimer = 0;
function frame(now) {
  // Simulate in small steps so slow devices still play at real speed.
  const total = Math.min((now - last) / 1000, 0.25); last = now;
  const steps = Math.ceil(total / 0.05) || 1, dt = total / steps;
  const t = now / 1000;
  for (let i = 0; i < steps; i++) update(dt, now);

  const h = myHeight();
  animateGiant(me, h, dt, t, S.stomach.length > 0);
  for (const r of RIVALS) animateGiant(r.g, rivalHeight(r), dt, t + r.x, true);
  animateAvatar(dt, t);
  for (const w of walkers) {
    const d = w.target.clone().sub(w.pos); d.y = 0;
    if (d.length() < 1.5) { w.t -= dt; if (w.t <= 0) { pickTarget(w); w.t = 1 + Math.random() * 3; } }
    else { d.normalize(); w.pos.addScaledVector(d, dt * 9); w.g.rotation.y = Math.atan2(d.x, d.z); const s = Math.sin(t * 9 + w.pos.x) * 0.8; w.lL.rotation.x = s; w.lR.rotation.x = -s; }
    w.g.position.copy(w.pos);
  }
  if (!reduceMotion) {
    windmill.rotation.z += dt * 0.8; labRing.rotation.x = Math.PI / 2 + Math.sin(t) * 0.3; labRing.rotation.z += dt * 1.5;
    feedArrow.position.y = 7 + Math.sin(t * 3) * 0.8; feedArrow.rotation.y += dt * 2;
    for (const jp of jumpPads) jp.chev.position.y = 1.5 + ((t * 2) % 1.5);
    for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 400) c.position.x = -400; }
    for (const st of stations) st.ring.scale.setScalar(1 + Math.sin(t * 4) * 0.04);
    fountainTop.rotation.y += dt;
  }

  // Camera follows the player
  const look = player.pos.clone().setY(player.pos.y + 3.5);
  const dist = camDist + Math.min(player.pos.y * 0.3, 20);
  const want = new THREE.Vector3(look.x + Math.sin(camYaw) * Math.cos(camPitch) * dist, look.y + Math.sin(camPitch) * dist, look.z + Math.cos(camYaw) * Math.cos(camPitch) * dist);
  camera.position.lerp(want, Math.min(1, dt * 8));
  if (shake > 0) { shake = Math.max(0, shake - dt); camera.position.x += (Math.random() - .5) * shake * 2; camera.position.y += (Math.random() - .5) * shake * 2; }
  camera.lookAt(look);
  sun.position.set(player.pos.x + 80, 160, player.pos.z + 60); sun.target.position.copy(player.pos);

  // Labels
  for (const l of labels) {
    const p = l.getPos(); const dd = p.distanceTo(camera.position);
    tmpV.copy(p).project(camera);
    if (tmpV.z < 1 && dd < l.maxDist && Math.abs(tmpV.x) < 1.2 && Math.abs(tmpV.y) < 1.2) {
      l.el.style.display = "";
      l.el.style.transform = `translate(${(tmpV.x * .5 + .5) * innerWidth}px, ${(-tmpV.y * .5 + .5) * innerHeight}px) translate(-50%, -100%)`;
    } else l.el.style.display = "none";
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt;
    tmpV.copy(p.pos).setY(p.pos.y + p.t * 4).project(camera);
    p.el.style.transform = `translate(${(tmpV.x * .5 + .5) * innerWidth}px, ${(-tmpV.y * .5 + .5) * innerHeight}px) translate(-50%, -100%)`;
    p.el.style.opacity = String(1 - p.t);
    if (p.t >= 1) { p.el.remove(); pops.splice(i, 1); }
  }

  // HUD (a few times a second)
  hudTimer -= dt;
  if (hudTimer <= 0) {
    hudTimer = 0.1;
    $("cash").textContent = fmtCash(S.cash);
    $("income").textContent = "+" + fmtNum(Growth.income(h) * (0.3 + coinMult())) + "/s";
    $("height").textContent = fmtH(h);
    $("myH").textContent = fmtH(h);
    for (const r of RIVALS) r.hb.textContent = fmtH(rivalHeight(r));
    renderBag(); renderSlots(); refreshPanel(); drawMinimap();
    const rank = renderBoard();
    if (rank === 1 && lastRank > 1 && lastRank !== 99) { banner("#1 TALLEST!", "Your Giant wears the crown"); burst(MY_POS.clone().setY(12 * me.shown), 0xffd23a, 30, 12); }
    lastRank = rank;
  }
  saveTimer -= dt; if (saveTimer <= 0) { saveTimer = 5; save(); }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Offline catch-up: food keeps digesting while the tab is closed (up to 24h)
function catchUp(show) {
  const away = Math.min(Math.max((Date.now() - S.lastSeen) / 1000, 0), 86400);
  const before = S.mass; S.mass += digest(away * digestMult()); S.lastSeen = Date.now();
  if (show && S.mass - before > 0.5) toast(`Welcome back! Your Giant digested ${fmtNum(S.mass - before)} mass while you were away.`, "success");
}
catchUp(true);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else { catchUp(true); last = performance.now(); } });
addEventListener("pagehide", save);

renderSlots(true); renderBag();
if (S.tutorial) setTimeout(() => toast("Walk to the green FOOD MARKET on your left, or grab free food in the Orchard behind you.", "success"), 600);
requestAnimationFrame(frame);
})();
</script>
