<title>Grow a Giant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed city you stomp through. Minimal HUD - stats card top left, next-unlock bar top center,
   stomach bar bottom center, station panel on the right only while you stand on a pad. */
:root {
  color-scheme: dark;
  --card: rgba(30, 33, 52, 0.82);
  --raised: rgba(255, 255, 255, 0.08);
  --text: #f7f6f2;
  --muted: #b7b9c9;
  --cash: #9be38a;
  --gold: #ffd166;
  --coral: #e07a5f;
  --sage: #81b29a;
  --violet: #8d7cf0;
  --off: rgba(255, 255, 255, 0.10);
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Rubik", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; overflow: hidden; background: #bfe3f7; color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.hud { position: fixed; inset: 0; pointer-events: none; }
.live { pointer-events: auto; }
.pad { position: absolute; }

.card { background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 18px; box-shadow: 0 8px 24px rgba(20, 24, 40, .22); }

.stats { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; padding: 10px 16px 12px; display: grid; gap: 2px; min-width: 150px; font-variant-numeric: tabular-nums; }
.stats small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stats .big { font-family: var(--font-display); font-size: 34px; line-height: 1; }
#cash { color: var(--cash); font-family: var(--font-display); font-size: 24px; line-height: 1.1; }

.next { top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 8px 14px 10px; width: min(300px, calc(100% - 220px)); text-align: center; }
.next p { margin: 0 0 6px; font-size: 13px; font-weight: 500; }
.next p b { color: var(--gold); }
.bar { height: 8px; border-radius: 99px; background: var(--off); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--gold); transition: width .2s linear; }

.combo { top: calc(96px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%) scale(.8); opacity: 0; font-family: var(--font-display); font-size: 30px; color: var(--gold); text-shadow: 0 3px 0 rgba(120, 70, 0, .7), 0 6px 14px rgba(0,0,0,.25); transition: opacity .2s, transform .15s; white-space: nowrap; }
.combo.on { opacity: 1; transform: translateX(-50%) scale(1); }

.toasts { top: calc(140px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; width: min(400px, calc(100% - 32px)); }
.toast { padding: 8px 14px; border-radius: 12px; font-weight: 500; font-size: 14px; text-align: center; background: var(--card); backdrop-filter: blur(8px); transition: opacity .4s; }
.toast.warn { background: rgba(224, 122, 95, .94); }
.toast.good { background: rgba(70, 140, 100, .94); }
.toast.out { opacity: 0; }

.banner { top: 30%; left: 50%; transform: translate(-50%, -50%) scale(.7); opacity: 0; text-align: center; white-space: nowrap; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .3s; }
.banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.banner b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 58px); color: #fff; text-shadow: 0 4px 0 rgba(40, 44, 70, .55), 0 10px 24px rgba(0,0,0,.25); }
.banner span { font-weight: 700; font-size: 15px; text-shadow: 0 2px 6px rgba(0,0,0,.5); }

.stomach { left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(380px, calc(100% - 32px)); padding: 9px 14px 11px; box-sizing: border-box; }
.stomach .row1 { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.stomach .row1 span:last-child { color: var(--muted); font-weight: 500; text-align: right; }
.stomach .bar { height: 12px; }
.stomach .bar i { background: linear-gradient(90deg, var(--coral), var(--gold)); }

.panel { right: 16px; top: 50%; transform: translateY(-50%); width: 320px; max-height: calc(100% - 200px); display: flex; flex-direction: column; overflow: hidden; }
.panel header { padding: 14px 16px 6px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.panel header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.list { overflow-y: auto; padding: 6px 10px 12px; display: grid; gap: 4px; }
.item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; }
.item:hover { background: var(--raised); }
.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 15px; color: rgba(0,0,0,.55); }
.info { min-width: 0; }
.name { font-weight: 700; font-size: 14px; }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { min-width: 70px; padding: 6px 10px; border-radius: 10px; font-weight: 700; font-size: 12px; background: var(--sage); color: #10241a; transition: filter .15s, transform .05s; }
.btn.gym { background: var(--violet); color: #fff; }
.btn:hover { filter: brightness(1.1); } .btn:active { transform: translateY(1px); }
.btn.off { background: var(--off); color: var(--muted); }

.label3d { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; text-align: center; font-family: var(--font-display); font-size: 17px; padding: 4px 10px; border-radius: 10px; background: rgba(30, 33, 52, .72); will-change: transform; }
.label3d small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); font-weight: 500; }
.pop { position: absolute; left: 0; top: 0; pointer-events: none; font-family: var(--font-display); font-size: 20px; white-space: nowrap; color: var(--cash); text-shadow: 0 2px 0 rgba(0,0,0,.45); }

.help { left: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-size: 12px; line-height: 1.5; color: #1f2438; max-width: 230px; transition: opacity 1s; }
.help kbd { font-family: var(--font-body); font-weight: 700; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,.7); }
.help.fade { opacity: 0; }

.joy { width: 116px; height: 116px; border-radius: 50%; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4); transform: translate(-50%, -50%); }
.joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.6); }
.jump { right: 22px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; border-radius: 50%; background: var(--card); border: 2px solid rgba(255,255,255,.35); font-family: var(--font-display); font-size: 16px; }

.devbtn { right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding: 5px 10px; border-radius: 8px; background: var(--card); color: var(--muted); font-size: 11px; font-weight: 700; }
.devpanel { right: 16px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; padding: 10px; width: 180px; }
.devpanel .btn { background: var(--raised); color: var(--text); text-align: left; }

@media (max-width: 760px) {
  .stats { min-width: 0; padding: 8px 12px 10px; } .stats .big { font-size: 26px; } #cash { font-size: 19px; }
  .next { top: auto; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 32px); box-sizing: border-box; }
  .panel { left: 16px; right: 16px; width: auto; top: calc(14px + env(safe-area-inset-top, 0px)); transform: none; max-height: 48%; }
  .help { display: none; }
  .devbtn { top: calc(14px + env(safe-area-inset-top, 0px)); bottom: auto; }
  .devpanel { top: calc(46px + env(safe-area-inset-top, 0px)); bottom: auto; }
  .jump { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .toast, .banner, .combo { transition: none; } }
</style>

<canvas id="scene" aria-label="A small city. You are the Giant. Walk with WASD or arrow keys, jump with Space, drag to turn the camera."></canvas>
<div class="hud">

  <div class="pad card stats">
    <small>Height</small>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";

// ===========================================================================
// Tuning
// ===========================================================================
const FOODS = [
  { id: "apple", name: "Apple", price: 2, mass: 2, digest: 2, color: "#e2574c" },
  { id: "hotdog", name: "Hot Dog", price: 8, mass: 9, digest: 2.5, color: "#e9a23b" },
  { id: "burger", name: "Burger", price: 30, mass: 36, digest: 3, color: "#b9733a" },
  { id: "pizza", name: "Pizza", price: 120, mass: 150, digest: 4, color: "#f2c14e" },
  { id: "cake", name: "Cake", price: 500, mass: 650, digest: 5, color: "#f4a6c6" },
  { id: "turkey", name: "Turkey", price: 2000, mass: 2800, digest: 6, color: "#c98a4b" },
  { id: "steak", name: "Golden Steak", price: 9000, mass: 13000, digest: 8, color: "#ffd166" },
  { id: "donut", name: "Galaxy Donut", price: 40000, mass: 60000, digest: 10, color: "#8d7cf0" },
];
const FOOD = Object.fromEntries(FOODS.map(f => [f.id, f]));

// Things in the city. You can smash anything once you're at least `need` meters tall.
const KINDS = {
  crate:     { name: "Crates", need: 2, cash: 3 },
  bench:     { name: "Benches", need: 2.6, cash: 5 },
  car:       { name: "Cars", need: 4, cash: 12 },
  tree:      { name: "Trees", need: 6, cash: 20 },
  shed:      { name: "Sheds", need: 9, cash: 50 },
  house:     { name: "Houses", need: 14, cash: 120 },
  shop:      { name: "Shops", need: 22, cash: 350 },
  apartment: { name: "Apartments", need: 35, cash: 900 },
  office:    { name: "Office Towers", need: 55, cash: 2500 },
  sky:       { name: "Skyscrapers", need: 90, cash: 7000 },
  radio:     { name: "Radio Towers", need: 140, cash: 25000 },
};
const TIERS = Object.entries(KINDS).sort((a, b) => a[1].need - b[1].need);

const UPGRADES = [
  { id: "stomach", name: "Bigger Stomach", icon: "S", color: "#e07a5f", base: 20, growth: 2.2, max: 10, text: l => `Hold ${5 + 2 * l} → ${7 + 2 * l} foods` },
  { id: "digest", name: "Fast Digestion", icon: "D", color: "#f2cc8f", base: 25, growth: 2.1, max: 15, text: l => `${(1 + .35 * l).toFixed(2)}x → ${(1.35 + .35 * l).toFixed(2)}x speed` },
  { id: "value", name: "Smash Bonus", icon: "$", color: "#9be38a", base: 40, growth: 2.3, max: 20, text: l => `${(1 + .3 * l).toFixed(1)}x → ${(1.3 + .3 * l).toFixed(1)}x cash` },
  { id: "speed", name: "Long Legs", icon: "L", color: "#8ecae6", base: 30, growth: 2.0, max: 10, text: l => `${Math.round(100 + 12 * l)}% → ${Math.round(112 + 12 * l)}% run speed` },
  { id: "stomp", name: "Mega Stomp", icon: "M", color: "#8d7cf0", base: 60, growth: 2.4, max: 8, text: l => `${Math.round(100 + 25 * l)}% → ${Math.round(125 + 25 * l)}% stomp size` },
];
const UP = Object.fromEntries(UPGRADES.map(u => [u.id, u]));
const upCost = (u, l) => Math.round(u.base * Math.pow(u.growth, l));

const heightOf = mass => 2 * Math.sqrt(1 + Math.max(mass, 0) / 20);
const RESPAWN = 40;

// ===========================================================================
// Format
// ===========================================================================
const SUF = ["", "K", "M", "B", "T", "Qa", "Qi"];
function fmtNum(n) {
  if (!isFinite(n)) return "0";
  n = Math.max(0, n);
  if (n < 1000) return String(Math.floor(n));
  const t = Math.min(Math.floor(Math.log10(n) / 3), SUF.length - 1), s = n / Math.pow(10, t * 3);
  let x = s >= 100 ? String(Math.floor(s)) : s >= 10 ? (Math.floor(s * 10) / 10).toFixed(1) : (Math.floor(s * 100) / 100).toFixed(2);
  if (x.includes(".")) x = x.replace(/0+$/, "").replace(/\.$/, "");
  return x + SUF[t];
}
const fmtCash = n => "$" + fmtNum(n);
const fmtH = m => m < 1000 ? m.toFixed(1) + "m" : fmtNum(m) + "m";

// ===========================================================================
// Save (this browser only)
// ===========================================================================
const SAVE_KEY = "grow-a-giant-v3";
const fresh = () => ({ cash: 6, mass: 0, stomach: [], up: { stomach: 0, digest: 0, value: 0, speed: 0, stomp: 0 }, best: 2, lastSeen: Date.now(), tut: 0 });
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (!d) return null;
    const b = fresh(); for (const k in b) if (d[k] !== undefined && typeof d[k] === typeof b[k]) b[k] = d[k];
    b.up = Object.assign(fresh().up, d.up || {}); return b;
  } catch (e) { return null; }
}
function save() { S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
const hot = window.claude && window.claude.hot;
let S = (hot && hot.data && hot.data.S) || load() || fresh();
if (hot && hot.snapshot) hot.snapshot(() => ({ S }));

const stomachCap = () => 5 + 2 * S.up.stomach;
const digestMult = () => 1 + 0.35 * S.up.digest;
const valueMult = () => 1 + 0.3 * S.up.value;
const H = () => heightOf(S.mass);

function digest(dt) {
  let gained = 0; const left = [];
  for (const it of S.stomach) {
    const f = FOOD[it.id]; if (!f) continue;
    const step = Math.min(dt, it.left);
    gained += f.mass * step / f.digest;
    if (it.left - step > 1e-6) left.push({ id: it.id, left: it.left - step });
  }
  S.stomach = left; return gained;
}

// ===========================================================================
// DOM helpers
// ===========================================================================
const $ = id => document.getElementById(id);
function toast(msg, kind) {
  const el = document.createElement("div"); el.className = "toast " + (kind || ""); el.textContent = msg;
  $("toasts").appendChild(el);
  while ($("toasts").children.length > 2) $("toasts").firstChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 400); }, 2600);
}
const warned = {};
function warnOnce(key, msg) { const n = performance.now(); if (!warned[key] || n - warned[key] > 3000) { warned[key] = n; toast(msg, "warn"); } }
let bannerTimer = 0;
function banner(big, small) {
  $("bannerBig").textContent = big; $("bannerSmall").textContent = small || "";
  $("banner").classList.add("show"); clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => $("banner").classList.remove("show"), 2400);
}

// ===========================================================================
// Scene
// ===========================================================================
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const SKY = 0xbfe3f7;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 120, 600);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 6000);
scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x93a882, 0.6));
const sun = new THREE.DirectionalLight(0xfff3e2, 0.75);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
scene.add(sun); scene.add(sun.target);

// One material for the whole city; colors live in the geometry.
const cityMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const unitBox = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
// Merge many boxes into one geometry: parts = [w, h, d, x, y, z, color]
function merged(parts) {
  const bp = unitBox.attributes.position.array, bn = unitBox.attributes.normal.array;
  const pos = [], nor = [], col = [], c = new THREE.Color();
  for (const [w, h, d, x, y, z, color] of parts) {
    c.set(color);
    for (let i = 0; i < bp.length; i += 3) {
      pos.push(bp[i] * w + x, bp[i + 1] * h + y, bp[i + 2] * d + z);
      nor.push(bn[i], bn[i + 1], bn[i + 2]); col.push(c.r, c.g, c.b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.computeBoundingSphere();
  return g;
}
function flat(parts, shadows) {
  const m = new THREE.Mesh(merged(parts), cityMat);
  m.receiveShadow = true; m.castShadow = !!shadows; scene.add(m); return m;
}

// Palette
const P = {
  grass: 0x8dbd6c, road: 0x545b69, line: 0xf2efe6, walk: 0xe4e0d6, plaza: 0xefe6d2,
  cream: 0xf3e9d2, coral: 0xe07a5f, sage: 0x81b29a, navy: 0x3d405b, mustard: 0xf2cc8f, violet: 0x8d7cf0,
  glass: 0x8ecae6, glassDark: 0x5c8fb0, steel: 0xb8bfc8, white: 0xfbfaf7, wood: 0xa9744f, leaf: 0x5f9e5a, leaf2: 0x76b56c,
};

// ---- City layout: 9x9 blocks around a central plaza -------------------------------
const BLOCK = 56, ROAD = 14, PITCH = BLOCK + ROAD, N = 4;
const HALF = (N + 0.5) * PITCH;  // edge of the city
{
  const parts = [];
  parts.push([HALF * 2 + 40, 0.2, HALF * 2 + 40, 0, -0.1, 0, P.road]);
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
    const cx = i * PITCH, cz = j * PITCH, center = i === 0 && j === 0;
    parts.push([BLOCK + 4, 0.3, BLOCK + 4, cx, 0.05, cz, P.walk]);
    parts.push([BLOCK - 2, 0.32, BLOCK - 2, cx, 0.06, cz, center ? P.plaza : P.grass]);
  }
  for (let k = -N; k <= N + 1; k++) {                    // dashed center lines
    const r = (k - 0.5) * PITCH;
    for (let s = -HALF; s < HALF; s += 10) {
      parts.push([0.5, 0.22, 4, r, 0.01, s + 5, P.line]);
      parts.push([4, 0.22, 0.5, s + 5, 0.01, r, P.line]);
    }
  }
  flat(parts, false);
  const outer = new THREE.Mesh(new THREE.CircleGeometry(4000, 48), new THREE.MeshLambertMaterial({ color: P.grass }));
  outer.rotation.x = -Math.PI / 2; outer.position.y = -0.3; outer.receiveShadow = true; scene.add(outer);
}

// ---- Prefabs (built once, shared) ------------------------------------------------
const prefabCache = {};
function prefab(kind, v) {
  const key = kind + v; if (prefabCache[key]) return prefabCache[key];
  const pick = arr => arr[v % arr.length];
  let parts, hw, hd, h;
  switch (kind) {
    case "crate": parts = [[1.2, 1.2, 1.2, 0, 0.6, 0, P.wood], [1.25, 0.15, 1.25, 0, 1.1, 0, 0x8a5a3a]]; hw = hd = 0.6; h = 1.2; break;
    case "bench": parts = [[2.4, 0.15, 0.7, 0, 0.6, 0, P.wood], [2.4, 0.6, 0.12, 0, 1, -0.3, P.wood], [0.12, 0.6, 0.6, -1, 0.3, 0, P.navy], [0.12, 0.6, 0.6, 1, 0.3, 0, P.navy]]; hw = 1.2; hd = 0.4; h = 1.3; break;

  if (tier > lastTier) {
    lastTier = tier;
    const [, k] = TIERS[tier];
    banner(`${fmtH(k.need)} TALL!`, `You can smash ${k.name} now`);
    shake = 0.8;
  }

  // Movement relative to the camera
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1; if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (joyId !== null) { mx += joyV.x; mz -= joyV.y; }
  const ml = Math.hypot(mx, mz);
  const speed = 8 * Math.pow(s, 0.8) * (1 + 0.12 * S.up.speed);
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = -fz, rz = fx;
  let wx = 0, wz = 0;
  if (ml > 0.05) { const k = Math.min(1, ml) / ml; wx = (fx * mz + rx * mx) * k * speed; wz = (fz * mz + rz * mx) * k * speed; player.yaw = Math.atan2(wx, wz); }
  const acc = player.grounded ? 12 : 4;
  player.vel.x += (wx - player.vel.x) * Math.min(1, dt * acc);
  player.vel.z += (wz - player.vel.z) * Math.min(1, dt * acc);
  if ((keys.Space || jumpQ) && player.grounded) { player.vel.y = 13 * s; player.grounded = false; player.air = 0; }
  jumpQ = false;
  player.vel.y -= 34 * s * dt;
  player.pos.addScaledVector(player.vel, dt);
  if (!player.grounded) player.air += dt;
  if (player.pos.y <= 0.2) {
    player.pos.y = 0.2; player.vel.y = 0;
    if (!player.grounded && player.air > 0.3) stomp(h);
    player.grounded = true;
  }

  // Bump into or smash things
  const pr = 0.22 * h;
  for (const o of objects) {
    if (!o.alive || player.pos.y > o.pf.h + 0.2) continue;
    const c = circleBox(player.pos.x, player.pos.z, pr, o);
    if (!c.hit) continue;
    if (canSmash(o)) { smash(o); continue; }
    const d = Math.hypot(c.dx, c.dz);
    if (d > 1e-4) { player.pos.x = c.cx + c.dx / d * pr; player.pos.z = c.cz + c.dz / d * pr; }
    else player.pos.x += (player.pos.x > o.x ? 1 : -1) * 0.1;
    warnOnce(o.kind, `Too big! Grow to ${fmtH(o.base.need)} to smash ${o.base.name}.`);
  }
  const lim = HALF + 20;
  player.pos.x = Math.max(-lim, Math.min(lim, player.pos.x)); player.pos.z = Math.max(-lim, Math.min(lim, player.pos.z));

  // Stations: stand on a pad (when huge, the closest pad under you counts)
  let on = null, best = Infinity;
  if (player.pos.y < 1 + h * 0.3) for (const st of stations) {
    const d = Math.hypot(player.pos.x - st.x, player.pos.z - st.z);
    if (d < PAD_R + pr * 0.5 && d < best) { best = d; on = st.id; }
  }
  if (on !== open) openPanel(on);

  // Cars drive
  for (const o of cars) {
    const c = o.car; c.s += c.dir * c.speed * dt;
    if (c.s > HALF) c.s = -HALF; if (c.s < -HALF) c.s = HALF;
    if (c.along) { o.x = c.s; o.z = c.line; } else { o.x = c.line; o.z = c.s; }
    o.m.position.set(o.x, 0.2, o.z);
  }
  // Rebuild smashed things after a while
  for (const o of objects) {
    if (o.alive) { if (o.grow < 1) { o.grow = Math.min(1, o.grow + dt * 2); o.m.scale.setScalar(o.grow); } continue; }
    o.respawn -= dt;
    if (o.respawn <= 0 && !circleBox(player.pos.x, player.pos.z, pr * 1.5, o).hit) { o.alive = true; o.m.visible = true; o.grow = 0.01; o.m.scale.setScalar(0.01); }
  }

  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) { combo = 0; $("combo").classList.remove("on"); } }

  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.life -= dt; d.v.y -= d.g * dt; d.m.position.addScaledVector(d.v, dt);
    d.m.rotation.x += d.r.x * dt; d.m.rotation.y += d.r.y * dt;
    if (d.m.position.y < d.s / 2) { d.m.position.y = d.s / 2; d.v.multiplyScalar(0.5); d.v.y = Math.abs(d.v.y) * 0.3; }
    if (d.life < 0.3) d.m.scale.setScalar(d.s * Math.max(0.01, d.life / 0.3));
    if (d.life <= 0) { scene.remove(d.m); debris.splice(i, 1); }
  }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i]; w.t += dt * 2.5;
    w.m.scale.setScalar(Math.max(0.01, w.r * w.t)); w.m.material.opacity = 0.8 * (1 - w.t);
    if (w.t >= 1) { scene.remove(w.m); w.m.material.dispose(); waves.splice(i, 1); }
  }
}

function stomp(h) {
  const r = h * 0.9 * (1 + 0.25 * S.up.stomp);
  shockwave(player.pos.x, player.pos.z, r);
  shake = Math.min(1.5, shake + 0.4);
  burst(player.pos.x, 0.3, player.pos.z, [P.walk, P.grass], 10, h * 0.05, h * 0.8);
  let n = 0;
  for (const o of objects) {
    if (!o.alive || !canSmash(o)) continue;
    if (circleBox(player.pos.x, player.pos.z, r, o).hit) { smash(o); n++; }
  }
  if (n >= 3) pop(`STOMP x${n}`, player.pos.clone().setY(h * 1.3), "#ffd166");
}

// ===========================================================================
// Animation + camera + HUD
// ===========================================================================
function animateYou(dt, t) {
  player.shown += (H() - player.shown) * Math.min(1, dt * 3);
  const s = player.shown / 2;
  you.scale.setScalar(s); you.position.copy(player.pos);
  let d = player.yaw - you.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
  you.rotation.y += d * Math.min(1, dt * 12);
  const hs = Math.hypot(player.vel.x, player.vel.z) / s;
  player.walk += dt * hs * 1.2;
  const sw = player.grounded ? Math.sin(player.walk) * Math.min(1, hs / 4) * 0.8 : 0;
  Y.legL.rotation.x = player.grounded ? sw : -0.7; Y.legR.rotation.x = player.grounded ? -sw : 0.3;
  Y.armL.rotation.x = -sw; Y.armR.rotation.x = sw;
  Y.armL.rotation.z = player.grounded ? 0 : -0.9; Y.armR.rotation.z = player.grounded ? 0 : 0.9;
  player.chomp = Math.max(0, player.chomp - dt * 3);
  Y.mouth.scale.y = 1 + player.chomp * 4;
  const busy = S.stomach.length > 0 && !reduceMotion;
  Y.body.scale.set(busy ? 1 + Math.sin(t * 8) * 0.03 : 1, 1, busy ? 1.06 : 1);
}

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const tv = new THREE.Vector3();
let last = performance.now(), hud = 0, saveT = 0, shadowSize = 0;
function frame(now) {
  const total = Math.min((now - last) / 1000, 0.25); last = now;
  const steps = Math.ceil(total / 0.04) || 1, dt = total / steps, t = now / 1000;
  for (let i = 0; i < steps; i++) update(dt);
  animateYou(total, t);
  const h = player.shown;

  if (!reduceMotion) for (const st of stations) st.ring.material.opacity = 0.65 + Math.sin(t * 4) * 0.25;

  // Camera follows you and pulls back as you grow
  const look = new THREE.Vector3(player.pos.x, player.pos.y + h * 0.75, player.pos.z);
  const dist = (h * 2.4 + 5) * zoom;
  const want = new THREE.Vector3(look.x + Math.sin(camYaw) * Math.cos(camPitch) * dist, look.y + Math.sin(camPitch) * dist, look.z + Math.cos(camYaw) * Math.cos(camPitch) * dist);
  camera.position.lerp(want, Math.min(1, total * 8));
  if (shake > 0 && !reduceMotion) { const k = shake * h * 0.04; camera.position.x += (Math.random() - .5) * k; camera.position.y += (Math.random() - .5) * k; }
  shake = Math.max(0, shake - total * 2);
  camera.lookAt(look);
  scene.fog.near = 80 + h * 4; scene.fog.far = 420 + h * 10;

  // Sun and shadows follow you, sized to your scale
  const ss = Math.max(60, Math.round(h * 6 / 20) * 20);
  if (ss !== shadowSize) {
    shadowSize = ss;
    Object.assign(sun.shadow.camera, { left: -ss, right: ss, top: ss, bottom: -ss, near: 1, far: ss * 6 });
    sun.shadow.camera.updateProjectionMatrix();
  }
  sun.position.set(player.pos.x + ss * 0.8, ss * 2.5, player.pos.z + ss * 0.6); sun.target.position.copy(player.pos);

  for (const l of labels) {
    const p = l.getPos(); tv.copy(p).project(camera);
    if (tv.z < 1 && Math.abs(tv.x) < 1.1 && Math.abs(tv.y) < 1.1 && p.distanceTo(camera.position) < 120 + h * 10) {
      l.el.style.display = ""; l.el.style.transform = `translate(${(tv.x * .5 + .5) * innerWidth}px, ${(-tv.y * .5 + .5) * innerHeight}px) translate(-50%, -100%)`;
    } else l.el.style.display = "none";
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += total * 1.2;
    tv.copy(p.pos); tv.y += p.t * h * 0.5; tv.project(camera);
    p.el.style.transform = `translate(${(tv.x * .5 + .5) * innerWidth}px, ${(-tv.y * .5 + .5) * innerHeight}px) translate(-50%, -100%)`;
    p.el.style.opacity = String(1 - p.t * p.t);
    if (p.t >= 1) { p.el.remove(); pops.splice(i, 1); }
  }

  hud -= total;
  if (hud <= 0) {
    hud = 0.1;
    const hh = H();
    $("height").textContent = fmtH(hh);
    $("cash").textContent = fmtCash(S.cash);
    const cap = stomachCap(), n = S.stomach.length;
    $("stomachText").textContent = `Stomach ${n}/${cap}`;
    const rate = S.stomach.reduce((a, it) => a + FOOD[it.id].mass / FOOD[it.id].digest, 0) * digestMult();
    $("digestText").textContent = n ? `Digesting +${fmtNum(rate)} mass/s` : "Empty · eat at the Food Truck";
    $("stomachBar").style.width = (n / cap * 100) + "%";
    const nextI = TIERS.findIndex(([, k]) => k.need > hh);
    if (nextI === -1) { $("nextText").innerHTML = "You can smash <b>everything</b>"; $("nextBar").style.width = "100%"; }
    else {
      const [, k] = TIERS[nextI], prev = nextI > 0 ? TIERS[nextI - 1][1].need : 2;
      $("nextText").innerHTML = `Next: <b>${k.name}</b> at ${fmtH(k.need)}`;
      $("nextBar").style.width = Math.max(0, Math.min(100, (hh - prev) / (k.need - prev) * 100)) + "%";
    }
    refreshPanel();
  }
  saveT -= total; if (saveT <= 0) { saveT = 5; save(); }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Food keeps digesting while the tab is closed (up to 24 hours)
function catchUp(show) {
  const away = Math.min(Math.max((Date.now() - S.lastSeen) / 1000, 0), 86400);
  const before = H(); S.mass += digest(away * digestMult()); S.lastSeen = Date.now();
  if (show && H() - before > 0.05) toast(`Welcome back! You grew ${fmtH(H() - before)} while you were away.`, "good");
}
catchUp(true);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else { catchUp(true); last = performance.now(); } });
addEventListener("pagehide", save);
setTimeout(() => $("help").classList.add("fade"), 20000);
if (S.tut === 0) setTimeout(() => toast("You're tiny for now. Walk into the crates ahead to smash them for cash.", "good"), 700);
requestAnimationFrame(frame);
})();
</script>
