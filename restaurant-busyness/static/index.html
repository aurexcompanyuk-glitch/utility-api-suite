<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busy or Not — live venue busyness</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%234ade80'/></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Busy<span>orNot</span></h1>
  </div>
  <div class="source" id="source-badge" title="Active data source">…</div>
</header>

<main>
  <form class="search" id="search-form">
    <div class="field">
      <label for="q">What are you looking for?</label>
      <input id="q" name="q" type="text" value="coffee"
             placeholder="coffee, sushi, pizza, bar…" autocomplete="off">
    </div>
    <div class="field location">
      <label for="loc">Near</label>
      <div class="loc-row">
        <input id="loc" type="text" value="51.5074, -0.1278"
               placeholder="latitude, longitude" autocomplete="off">
        <button type="button" id="geo-btn" title="Use my location">Use my location</button>
      </div>
    </div>
    <div class="field">
      <label for="radius">Within</label>
      <select id="radius">
        <option value="1000">1 km</option>
        <option value="2000">2 km</option>
        <option value="5000" selected>5 km</option>
        <option value="10000">10 km</option>
        <option value="25000">25 km</option>
      </select>
    </div>
    <button type="submit" class="primary" id="search-btn">Search</button>
  </form>

  <div class="controls">
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="quiet">Quiet now</button>
      <button class="chip" data-filter="busy">Busy now</button>
    </div>
    <label class="sort">
      Sort
      <select id="sort">
        <option value="busyness">Busiest first</option>
        <option value="quietest">Quietest first</option>
        <option value="distance">Nearest</option>
        <option value="name">Name</option>
      </select>
    </label>
    <button class="ghost" id="refresh-btn" title="Refresh busyness">Refresh</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <section class="grid" id="results"></section>
</main>

<!-- Venue detail drawer -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Venue details">
  <button class="close" id="drawer-close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
